dataset: yelp
output_path: results
load_path: null
data_path: data

seed: 67

evaluation_budget: 100
max_budget: 30
min_budget: 5
n_trials: 100
optimizer: ifbo

approach: sequence-dl
num_workers: 1 # TODO: I don't think this is being properly used
num_parallel_trials: 2
max_num_rows: 100000
val_size: 0.1

max_trainers_in_memory: 2
log_level: INFO
use_random_selection: false
ifbo_greedy_candidate_selection: true

# Each epoch samples stochastic_epoch_fraction of the training batches
# instead of iterating the full dataset - cheaper epochs at the cost of
# per-epoch dataset coverage. Off by default.
stochastic_epochs: false
stochastic_epoch_fraction: 0.25

ifbo_thaw_step: 3