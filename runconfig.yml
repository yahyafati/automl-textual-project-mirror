dataset: yelp
output_path: results
load_path: null
data_path: data

seed: 67

evaluation_budget: 50
max_budget: 30
min_budget: 5
n_trials: 50
optimizer: ifbo

# Wall-clock cap (seconds) on a single trial's training call, checked once
# per epoch boundary. null = no cap.
max_trial_time_seconds: null

approach: sequence-dl
num_workers: 1
num_parallel_trials: 2
max_num_rows: 50000
val_size: 0.2

max_trainers_in_memory: 2
log_level: INFO
ifbo_use_random_selection: false
ifbo_greedy_candidate_selection: true
ifbo_incumbent_ensemble_top_k: 1
ifbo_incumbent_ensemble_accuracy_threshold: 0.05

# Each epoch samples stochastic_epoch_fraction of the training batches
# instead of iterating the full dataset - cheaper epochs at the cost of
# per-epoch dataset coverage. Off by default.
stochastic_epochs: false
stochastic_epoch_fraction: 0.5

ifbo_thaw_step: 1

# Global stop conditions for the ifBO loop, checked once per step
# (sequential) / dispatch round (parallel). null = disabled.
ifbo_max_wallclock_time: null
ifbo_patience: null
# Per-candidate: exclude a candidate from future selection once its best
# accuracy plateaus for this many consecutive steps. null = disabled.
ifbo_plateau_patience: null
# Minimum accuracy improvement to reset ifbo_patience / ifbo_plateau_patience.
ifbo_min_delta: 0.001

evaluate_incumbent: true

approach_params:
  seq_pretrained_model_name: distilbert-base-uncased
  optimizer: adamw
  scheduler: cosineannealinglr
  max_seq_length: 180
  class_balance: true